# Despliegue completo de PractiFP: base de datos, aplicación y HTTPS automático.
# Uso:  cp .env.produccion.example .env   (y rellénalo)   →   docker compose up -d --build
name: practifp
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: practifp
      MARIADB_USER: practifp
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - datos_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: practifp
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: practifp
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: https://${DOMINIO}
      TRUST_PROXY: 1
      # Correo para recuperar la contraseña (opcional; ver .env.produccion.example)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - archivos:/datos/uploads

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  datos_db:
  archivos:
  caddy_datos:
  caddy_config:
