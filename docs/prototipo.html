<title>PractiFP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: cabecera fija + franja de demo; páginas públicas a ancho de lectura; paneles con barra lateral que pasa a pestañas en móvil.
   Identidad: verde petróleo (formación, confianza) + amarillo taller (FP, oficio) sobre neutros con matiz verdoso. */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#E9F0EF; --fg:#11211F; --muted:#566966;
  --line:#D3DFDD; --primary:#0E5E5B; --primary-h:#0A4A48; --primary-fg:#FFFFFF; --primary-soft:#DCEDEB;
  --accent:#F2B33D; --accent-fg:#2B1D00; --accent-soft:#FCEFD3;
  --ok:#1E7F47; --warn:#A8670E; --bad:#B9381A; --info:#2459C9;
  --shadow:0 1px 2px rgb(16 40 38 / .06), 0 4px 16px rgb(16 40 38 / .06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1514; --surface:#111F1E; --surface-2:#182B29; --fg:#E4EEEC; --muted:#93A8A5;
  --line:#253937; --primary:#4DBAB2; --primary-h:#6FCFC8; --primary-fg:#05201E; --primary-soft:#163B38;
  --accent:#F5C05A; --accent-fg:#2B1D00; --accent-soft:#3A2F17;
  --ok:#4CC27F; --warn:#E3A64E; --bad:#F07B57; --info:#7DA6FF;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1514; --surface:#111F1E; --surface-2:#182B29; --fg:#E4EEEC; --muted:#93A8A5;
  --line:#253937; --primary:#4DBAB2; --primary-h:#6FCFC8; --primary-fg:#05201E; --primary-soft:#163B38;
  --accent:#F5C05A; --accent-fg:#2B1D00; --accent-soft:#3A2F17;
  --ok:#4CC27F; --warn:#E3A64E; --bad:#F07B57; --info:#7DA6FF;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico.sm{width:15px;height:15px;vertical-align:-2px}
.ico.fill{fill:currentColor}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:62px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--fg);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--primary)}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;position:relative}
.logo-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:3px;background:var(--accent);border:2px solid var(--surface)}
.logo-mark span{color:var(--primary-fg);font-size:1rem;font-weight:800;line-height:1}
.nav{display:flex;gap:4px;flex:1}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--r-sm);font-weight:500;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--fg);background:var(--surface-2)}
.nav button.on{color:var(--primary);background:var(--primary-soft);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center}
.btn.menu-btn{display:none}
.user-pill{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
@media (max-width:860px){
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:12px}
  .btn.menu-btn{display:inline-flex}
  .user-pill .uname{display:none}
  .top .wrap{gap:10px}
  .logo{margin-right:auto}
}
.demo{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:.85rem}
.demo .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:7px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-fg)}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-p{background:var(--primary);color:var(--primary-fg)}
.btn-p:hover{background:var(--primary-h)}
.btn-a{background:var(--accent);color:var(--accent-fg)}
.btn-o{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-g{background:none;color:var(--muted);padding:7px 10px}
.btn-g:hover{color:var(--fg);background:var(--surface-2)}
.btn-d{background:none;border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.btn-d:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn-sm{padding:6px 11px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:600;color:var(--fg)}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.8rem;color:var(--bad);font-weight:500}
.inp{width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.inp.bad{border-color:var(--bad)}
textarea.inp{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--primary);width:16px;height:16px}

/* Superficies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip.tec{background:var(--primary-soft);color:var(--primary)}
.chip.opt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.ciclo{font-family:var(--f-mono);font-size:.74rem;background:var(--fg);color:var(--bg);border-radius:4px;padding:2px 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ENVIADA{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.st-REVISADA{color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,transparent)}
.st-ENTREVISTA{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.st-ACEPTADA,.st-APROBADA,.st-VERIFICADA,.st-ACTIVA{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st-RECHAZADA,.st-INACTIVA{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st-PENDIENTE{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.verif{color:var(--primary);display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:600}
.noverif{color:var(--muted);display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:600}
.elogo{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:1rem;letter-spacing:.02em}
.elogo.lg{width:72px;height:72px;font-size:1.5rem;border-radius:14px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:.9rem}
.avatar.sm{width:30px;height:30px;font-size:.74rem}
.avatar.lg{width:88px;height:88px;font-size:1.8rem;font-family:var(--f-display)}
.stars{display:inline-flex;gap:1px;color:var(--accent)}
.stars .ico{width:16px;height:16px}
.stars .off{color:var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.88rem;color:var(--fg)}
.notice .ico{color:var(--primary);margin-top:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.linkish{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{text-decoration:underline}

/* Inicio */
.hero{background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;padding-block:52px 44px;align-items:center}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.05}
.hero h1 em{font-style:normal;color:var(--primary);background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.hero-lead{font-size:1.08rem;color:var(--muted);max-width:52ch;margin-top:16px}
.searchbar{display:flex;gap:8px;margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);flex-wrap:wrap}
.searchbar .inp{border:0;box-shadow:none;flex:1 1 180px}
.searchbar select.inp{flex:0 1 150px;border-left:1px solid var(--line);border-radius:0}
@media (max-width:640px){.searchbar select.inp{border-left:0;border-top:1px solid var(--line);flex-basis:100%}}
.ciclos-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.ciclo-tile{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:.85rem;font-weight:500}
.ciclo-tile:hover{border-color:var(--primary)}
.ticket{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ticket .tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.ticket .tk:nth-child(2){margin-left:24px}
.ticket .tk:nth-child(3){margin-left:8px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:32px}}
.section{padding-block:40px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how .card{display:flex;flex-direction:column;gap:8px}
.how .num{font-family:var(--f-mono);font-size:.8rem;color:var(--primary);font-weight:600}
@media (max-width:760px){.how{grid-template-columns:1fr}}

/* Ofertas */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}
.ocard:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.ocard .t{font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.25}
.ocard .emp{font-size:.86rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.ocard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto;font-size:.85rem}
.pay{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.pay.no{color:var(--muted);font-weight:500}
.fav{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.fav:hover{color:var(--bad);border-color:var(--bad)}
.fav.on{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:transparent}
.search-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start;padding-block:28px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:flex;flex-direction:column;gap:16px}
.filters .card{padding:16px;display:flex;flex-direction:column;gap:14px}
.tec-pick{display:flex;flex-wrap:wrap;gap:6px}
.tec-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted)}
.tec-pick button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.filters-toggle{display:none}
@media (max-width:900px){
  .search-layout{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .filters.open{display:flex}
  .filters-toggle{display:inline-flex}
}
.active-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.active-f button{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 6px 3px 10px;font-size:.78rem;font-weight:600;cursor:pointer}

/* Detalle */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;padding-block:28px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);cursor:pointer;font-weight:500;padding:0;margin-top:22px}
.back:hover{color:var(--primary)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts b{font-size:.95rem;font-variant-numeric:tabular-nums}
.prose{max-width:68ch;color:var(--fg)}
.prose p+p{margin-top:10px}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl-step{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding-bottom:18px;position:relative}
.tl-step:not(:last-child)::before{content:"";position:absolute;left:17px;top:34px;bottom:2px;width:2px;background:var(--line)}
.tl-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;background:var(--primary-soft);color:var(--primary);border:2px solid var(--surface);position:relative;z-index:1}
.tl-step.opt .tl-num{background:var(--surface);border:2px dashed var(--line);color:var(--muted)}
.tl-days{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;padding-top:8px}
.sticky-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.sticky-side{position:static}}
.apply-card{border-color:var(--primary);border-width:2px}

/* Mapa */
.map-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding-block:28px;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.elist{display:flex;flex-direction:column;gap:8px;max-height:600px;overflow:auto;padding-right:2px}
.eitem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.eitem:hover,.eitem.on{border-color:var(--primary)}
.eitem.on{box-shadow:0 0 0 3px var(--primary-soft)}
.map-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map-svg{display:block;width:100%;height:auto}
.map-svg .sea{fill:color-mix(in srgb,var(--info) 7%,var(--surface))}
.map-svg .land{fill:var(--surface-2);stroke:color-mix(in srgb,var(--primary) 35%,var(--line));stroke-width:1.2}
.map-svg .grat{stroke:var(--line);stroke-width:.6;stroke-dasharray:3 4}
.map-svg .city{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.mk{cursor:pointer}
.mk .pinb{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.mk .dot{fill:var(--primary-fg)}
.mk.on .pinb{fill:var(--accent);stroke:var(--fg)}
.mk.on .dot{fill:var(--accent-fg)}
.mk.dim{opacity:.25}
.mk:hover .pinb{fill:var(--primary-h)}
.pop{position:absolute;transform:translate(-50%,calc(-100% - 46px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;width:250px;max-width:80%;font-size:.85rem;z-index:2}
.pop::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pop.below{transform:translate(-50%,14px)}
.pop.below::after{bottom:auto;top:-7px;transform:translateX(-50%) rotate(225deg)}
.map-note{position:absolute;left:10px;bottom:8px;font-size:.72rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 8px;border-radius:4px}
.map-svg.pick{cursor:crosshair}

/* Perfil alumno / portfolio */
.prof-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--primary)}
.tec-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px}
.tec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.proj .img{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;background-size:cover;background-position:center}
.proj .img span{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#fff;text-shadow:0 1px 6px rgb(0 0 0 / .25);position:relative;padding:0 12px;text-align:center}
.proj .img.gen::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgb(255 255 255 / .18) 1px,transparent 1.5px);background-size:14px 14px}
.proj .b{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* Paneles */
.panel{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-block:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:flex;flex-direction:column;gap:2px}
.side .who{display:flex;gap:10px;align-items:center;padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.side button:hover{background:var(--surface-2);color:var(--fg)}
.side button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 7px}
@media (max-width:860px){
  .panel{grid-template-columns:1fr;gap:16px;padding-top:16px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side .who{display:none}
}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.84rem;color:var(--muted)}
.tile.hl{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.tile.hl span{color:inherit;opacity:.85}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.prog{display:flex;align-items:center;gap:0;margin-top:10px;flex-wrap:wrap}
.prog .s{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.prog .s i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.prog .s.done{color:var(--fg)} .prog .s.done i{background:var(--primary);border-color:var(--primary)}
.prog .s.rej{color:var(--bad)} .prog .s.rej i{background:var(--bad);border-color:var(--bad)}
.prog .bar{width:28px;height:2px;background:var(--line);margin:0 6px}
.prog .bar.done{background:var(--primary)}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.fase-ed{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto;gap:10px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
@media (max-width:700px){.fase-ed{grid-template-columns:auto minmax(0,1fr)}.fase-ed .fe-d,.fase-ed .fe-a{grid-column:2}}
.ord{display:flex;flex-direction:column;gap:2px;align-items:center}
.ord b{font-family:var(--f-mono);font-size:.9rem;color:var(--primary)}
.ord button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:4px}
.ord button:hover:not([disabled]){color:var(--fg);background:var(--surface-2)}
.ord button[disabled]{opacity:.3;cursor:default}
.tec-ed{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.radio-cards label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;background:var(--surface)}
.radio-cards input{accent-color:var(--primary);margin-top:3px}
.radio-cards label:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.auth{max-width:460px;margin:40px auto;width:100%}
.demo-acc{display:flex;flex-direction:column;gap:6px}
.demo-acc button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;text-align:left}
.demo-acc button:hover{border-color:var(--primary)}

/* Modal y toast */
.modal-bg{position:fixed;inset:0;background:rgb(6 18 17 / .55);z-index:80;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:90;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.pdf{background:var(--surface-2);border-radius:var(--r-sm);padding:24px;display:flex;flex-direction:column;gap:8px}
.pdf .page{background:#fff;color:#1b1b1b;border-radius:4px;padding:22px;box-shadow:var(--shadow);font-size:.82rem;display:flex;flex-direction:column;gap:6px}
.pdf .page h4{font-family:var(--f-display);font-size:1.1rem;color:#0E5E5B}
.pdf .bar2{height:6px;background:#e5e5e5;border-radius:3px}
.foot-site{border-top:1px solid var(--line);background:var(--surface);margin-top:30px}
.foot-site .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px;justify-content:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Mapa (SVG simplificado de la península) ---------- */
const MAP = {w:660, h:500, lng0:-9.6, lng1:4.5, lat0:35.8, lat1:44.0};
const proj = (lat, lng) => [ (lng - MAP.lng0) / (MAP.lng1 - MAP.lng0) * MAP.w, (MAP.lat1 - lat) / (MAP.lat1 - MAP.lat0) * MAP.h ];
const unproj = (x, y) => [ MAP.lat1 - y / MAP.h * (MAP.lat1 - MAP.lat0), MAP.lng0 + x / MAP.w * (MAP.lng1 - MAP.lng0) ];
const PENINSULA = [[-9.3,43.0],[-8.2,43.7],[-7.0,43.55],[-5.8,43.6],[-4.5,43.4],[-3.5,43.45],[-1.8,43.4],[-1.4,43.05],[0,42.7],[1.4,42.6],[3.2,42.4],[3.2,41.9],[2.1,41.3],[0.9,41.0],[0.2,40.2],[-0.3,39.5],[0.2,38.8],[-0.5,38.3],[-0.8,37.6],[-1.6,37.3],[-2.1,36.7],[-3.4,36.7],[-4.4,36.7],[-5.3,36.1],[-6.0,36.4],[-6.4,36.9],[-7.4,37.2],[-7.5,37.6],[-7.0,38.0],[-7.3,38.6],[-7.0,39.0],[-7.5,39.6],[-6.9,40.2],[-6.8,41.0],[-6.2,41.6],[-6.6,41.9],[-8.1,41.8],[-8.9,42.1]];
const PORTUGAL = [[-8.9,42.1],[-8.1,41.8],[-6.6,41.9],[-6.2,41.6],[-6.8,41.0],[-6.9,40.2],[-7.5,39.6],[-7.0,39.0],[-7.3,38.6],[-7.0,38.0],[-7.5,37.6],[-7.4,37.2],[-8.9,37.0],[-8.8,38.7],[-9.5,38.8],[-8.9,40.5],[-8.7,41.5]];
const MALLORCA = [[2.35,39.6],[3.1,39.95],[3.48,39.7],[3.25,39.3],[2.7,39.45]];
const poly = pts => pts.map(([lng,lat]) => proj(lat,lng).map(v => v.toFixed(1)).join(',')).join(' ');
function mapSVG({ empresas, sel = null, dimLoc = '', pick = false, single = null }){
  const grat = [];
  for (let lng = -9; lng <= 4; lng++) { const [x] = proj(0, lng); grat.push(`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${MAP.h}"/>`); }
  for (let lat = 36; lat <= 43; lat++) { const [,y] = proj(lat, 0); grat.push(`<line class="grat" x1="0" y1="${y}" x2="${MAP.w}" y2="${y}"/>`); }
  const marks = empresas.map(e => {
    const [x,y] = proj(e.lat, e.lng);
    const on = sel == e.id || single;
    const dim = dimLoc && e.localidad !== dimLoc;
    return `<g class="mk ${on ? 'on' : ''} ${dim ? 'dim' : ''}" ${single || pick ? '' : `data-act="mapSel" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.nombre)}"`} transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <path class="pinb" d="M0 0c-2-6-11-11-11-19a11 11 0 0 1 22 0c0 8-9 13-11 19z"/><circle class="dot" cy="-19" r="4"/></g>`;
  }).join('');
  return `<svg class="map-svg ${pick ? 'pick' : ''}" viewBox="0 0 ${MAP.w} ${MAP.h}" ${pick ? 'data-pick="1"' : ''} role="img" aria-label="Mapa de empresas">
    <rect class="sea" width="${MAP.w}" height="${MAP.h}"/>${grat.join('')}
    <polygon points="${poly(PORTUGAL)}" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <polygon class="land" points="${poly(PENINSULA)}"/><polygon class="land" points="${poly(MALLORCA)}"/>
    ${marks}</svg>`;
}

function filtrar(){
  const f = S.f;
  return D.ofertas.filter(o => {
    const e = emp(o.empresaId);
    if (f.activas && !ofertaAbierta(o)) return false;
    if (f.q && !(o.titulo + ' ' + o.descripcion + ' ' + e.nombre + ' ' + o.tecs.map(t => t.t).join(' ')).toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.ciclo && o.ciclo !== f.ciclo) return false;
    if (f.localidad && o.localidad !== f.localidad) return false;
    if (f.modalidad && o.modalidad !== f.modalidad) return false;
    if (f.remunerada && (f.remunerada === 'si') !== o.remunerada) return false;
    if (f.empresa && o.empresaId != f.empresa) return false;
    if (f.tecs.length && !f.tecs.every(t => o.tecs.some(x => x.t === t))) return false;
    return true;
  }).sort((a,b) => b.publicada.localeCompare(a.publicada));
}

function procesoHTML(fs){
  if (!fs.length) return `<div class="empty">La empresa todavía no ha publicado las fases de este proceso.</div>`;
  const min = fs.filter(f => f.obligatoria).reduce((s,f) => s + f.dias, 0), max = fs.reduce((s,f) => s + f.dias, 0);
  return `<div class="timeline">${fs.map(f => `<div class="tl-step ${f.obligatoria ? '' : 'opt'}">
      <div class="tl-num">${f.orden}</div>
      <div><b>${esc(f.nombre)}</b> ${f.obligatoria ? '' : '<span class="chip opt" style="margin-left:4px">Opcional</span>'}<p class="muted" style="font-size:.9rem">${esc(f.descripcion)}</p></div>
      <div class="tl-days">~${f.dias} ${f.dias === 1 ? 'día' : 'días'}</div></div>`).join('')}</div>
    <div class="notice">${ic('clock')}<span>Duración estimada del proceso: <b>${min === max ? max : `${min}–${max}`} días</b>${min !== max ? ' (según se apliquen las fases opcionales)' : ''}.</span></div>`;
}

function progreso(estado){
  const pasos = ['ENVIADA','REVISADA','ENTREVISTA','ACEPTADA'];
  if (estado === 'RECHAZADA') return `<div class="prog"><span class="s done"><i></i>ENVIADA</span><span class="bar done"></span><span class="s rej"><i></i>RECHAZADA</span></div>`;
  const k = pasos.indexOf(estado);
  return `<div class="prog">${pasos.map((p,i) => `${i ? `<span class="bar ${i <= k ? 'done' : ''}"></span>` : ''}<span class="s ${i <= k ? 'done' : ''}"><i></i>${p}</span>`).join('')}</div>`;
}

  const fs = S.draftFases, tot = fs.reduce((s,f) => s + (+f.dias || 0), 0);

  estadoCand(id, el){ const c = D.candidaturas.find(x => x.id == id); c.estado = el.value; render(); toast(`Candidatura marcada como ${c.estado}`); },
  procOferta(_, el){ S.procOferta = +el.value; S.draftFases = null; S.errors = {}; render(); },
  faseUp(i){ i = +i; const f = S.draftFases; [f[i-1], f[i]] = [f[i], f[i-1]]; render(); },
  faseDown(i){ i = +i; const f = S.draftFases; [f[i+1], f[i]] = [f[i], f[i+1]]; render(); },
  faseRm(i){ S.draftFases.splice(+i,1); render(); },
  faseAdd(){ S.draftFases.push({id:null, ofertaId:S.procOferta, nombre:'', descripcion:'', dias:3, obligatoria:true}); render(); $(`#fn-${S.draftFases.length - 1}`)?.focus(); },
  faseReset(){ S.draftFases = null; S.errors = {}; render(); toast('Cambios descartados'); },
  // Admin
  verificar(id){ emp(id).verificada = true; render(); toast(`${emp(id).nombre} verificada`); },
  desverificar(id){ emp(id).verificada = false; render(); toast('Verificación retirada'); },
  toggleUser(id){ const u = usr(id); u.activo = !u.activo; render(); toast(u.activo ? 'Cuenta activada' : 'Cuenta desactivada'); },
  toggleActivaAdm(id){ const o = ofe(id); o.activa = !o.activa; render(); toast(o.activa ? 'Oferta activada' : 'Oferta desactivada'); },
  valTab(k){ S.adminValTab = k; render(); },
  modVal(id, el){ const v = D.valoraciones.find(x => x.id == id); v.estado = el.dataset.v; render(); toast(v.estado === 'APROBADA' ? 'Valoración aprobada y publicada' : 'Valoración rechazada'); }
};
function keepForm(){
  const f = document.querySelector('form[data-form="oferta"]'); if (!f) return;
  const fd = new FormData(f);
  S.formVals = {titulo:fd.get('titulo'), descripcion:fd.get('descripcion'), ciclo:fd.get('ciclo'), localidad:fd.get('localidad'), plazas:fd.get('plazas'), modalidad:fd.get('modalidad'), remunerada:!!fd.get('remunerada'), salario:fd.get('salario') ?? '', limite:fd.get('limite'), activa:!!fd.get('activa')};
}

/* ---------- Formularios ---------- */
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const isUrl = s => /^https?:\/\/\S+\.\S+/.test(s);
const F = {
  heroSearch(fd){ S.f = {q:fd.get('q').trim(), ciclo:'', localidad:fd.get('localidad'), modalidad:'', remunerada:'', empresa:'', tecs:[], activas:true}; go('ofertas'); },
  login(fd){
    const email = fd.get('email').trim().toLowerCase(), pass = fd.get('pass'), e = {};
    if (!isEmail(email)) e.email = 'Introduce un correo válido.';
    if (!pass) e.pass = 'Introduce tu contraseña.';
    S.errors = e; if (Object.keys(e).length) return render();
    S.loading = true; render(); $('#l-email').value = email;
    setTimeout(() => {
      S.loading = false;
      const u = D.usuarios.find(u => u.email === email);
      if (!u || (pass !== CRED && pass !== u.pass)) { S.errors = {login:'Correo o contraseña incorrectos.'}; render(); $('#l-email').value = email; return; }
      if (!u.activo) { S.errors = {login:'Esta cuenta está desactivada. Contacta con el administrador.'}; render(); return; }
      login(u.rol, u.id); go('panel', null, 'dashboard'); toast(`Bienvenido/a, ${nombreUsuario(u)}`);
    }, 700);
  },
  registro(fd){
    const t = fd.get('tipo'), e = {}, email = fd.get('email').trim().toLowerCase();
    if (!fd.get('nombre').trim()) e.nombre = 'Campo obligatorio.';
    if (t === 'ALUMNO' && !fd.get('apellidos').trim()) e.apellidos = 'Campo obligatorio.';
    if (t === 'EMPRESA' && !fd.get('localidad').trim()) e.localidad = 'Campo obligatorio.';
    if (!isEmail(email)) e.email = 'Introduce un correo válido.';
    else if (D.usuarios.some(u => u.email === email)) e.email = 'Ya existe una cuenta con este correo.';
    if ((fd.get('pass') || '').length < 8) e.pass = 'La contraseña debe tener al menos 8 caracteres.';
    if (fd.get('pass') !== fd.get('pass2')) e.pass2 = 'Las contraseñas no coinciden.';
    S.errors = e;
    if (Object.keys(e).length) { const vals = Object.fromEntries(fd); render(); Object.entries(vals).forEach(([k,v]) => { const el = document.querySelector(`[name="${k}"]:not([type=radio])`); if (el && !el.type.includes('password')) el.value = v; }); return; }
    const uid = nextId(D.usuarios);
    D.usuarios.push({id:uid, email, rol:t, activo:true, alta:HOY, pass:fd.get('pass')});
    if (t === 'ALUMNO') D.alumnos.push({id:nextId(D.alumnos), usuarioId:uid, nombre:fd.get('nombre').trim(), apellidos:fd.get('apellidos').trim(), ciclo:fd.get('ciclo'), curso:'1º', centro:'', localidad:'', descripcion:'', cv:null, tecs:[], color:PALETA[uid % PALETA.length]});
    else D.empresas.push({id:nextId(D.empresas), usuarioId:uid, nombre:fd.get('nombre').trim(), localidad:fd.get('localidad').trim(), direccion:'', lat:40.4168, lng:-3.7038, verificada:false, web:'', telefono:'', descripcion:'', color:PALETA[uid % PALETA.length]});
    login(t, uid); go('panel', null, 'perfil'); toast('Cuenta creada. Completa tu perfil.');
  },
  perfilAlumno(fd){
    const e = {}; ['nombre','apellidos','centro','localidad'].forEach(k => { if (!fd.get(k).trim()) e[k] = 'Campo obligatorio.'; });
    S.errors = e; if (Object.keys(e).length) return render();
    const a = meAlumno(); ['nombre','apellidos','ciclo','curso','centro','localidad','descripcion'].forEach(k => a[k] = fd.get(k).trim());
    render(); toast('Perfil actualizado');
  },
  addTec(fd){ meAlumno().tecs.push({t:fd.get('t'), n:fd.get('n')}); render(); toast(`${fd.get('t')} añadida`); },
  proyecto(fd, form){
    let ok = true; const setE = (id, m) => { $('#' + id).textContent = m; if (m) ok = false; };
    setE('e-pr-t', fd.get('titulo').trim() ? '' : 'El título es obligatorio.');
    setE('e-pr-d', fd.get('descripcion').trim() ? '' : 'La descripción es obligatoria.');
    setE('e-pr-gh', !fd.get('github') || isUrl(fd.get('github')) ? '' : 'Introduce una URL válida (https://…).');
    setE('e-pr-demo', !fd.get('demo') || isUrl(fd.get('demo')) ? '' : 'Introduce una URL válida (https://…).');
    if (!ok) return;
    const tecs = [...document.querySelectorAll('#pr-tecs button.on')].map(b => b.dataset.id);
    const data = {titulo:fd.get('titulo').trim(), descripcion:fd.get('descripcion').trim(), github:fd.get('github').trim(), demo:fd.get('demo').trim(), fecha:fd.get('fecha') || HOY, tecs, img:S.projImg || null};
    const id = form.dataset.id;
    if (id) Object.assign(D.proyectos.find(p => p.id == id), data);
    else D.proyectos.push({id:nextId(D.proyectos), alumnoId:meAlumno().id, color:PALETA[D.proyectos.length % PALETA.length], ...data});
    closeModal(); render(); toast(id ? 'Proyecto actualizado' : 'Proyecto añadido al portfolio');
  },
  valorar(fd, form){
    const com = fd.get('comentario').trim(); let ok = true;
    if (!S.rating) { $('#e-rate').textContent = 'Elige una puntuación del 1 al 5.'; ok = false; }
    if (com.length < 10) { $('#e-vcom').textContent = 'Escribe al menos 10 caracteres.'; ok = false; } else $('#e-vcom').textContent = '';
    if (!ok) return;
    D.valoraciones.push({id:nextId(D.valoraciones), empresaId:+form.dataset.id, alumnoId:meAlumno().id, puntuacion:S.rating, comentario:com, fecha:HOY, estado:'PENDIENTE'});
    closeModal(); render(); toast('Valoración enviada. Se publicará tras la moderación.');
  },
  cfgEmail(fd){
    const email = fd.get('email').trim().toLowerCase(), u = usr(S.uid);
    S.errors = {}; if (!isEmail(email)) S.errors.cemail = 'Introduce un correo válido.';
    else if (D.usuarios.some(x => x.email === email && x.id !== u.id)) S.errors.cemail = 'Ese correo ya está en uso.';
    if (S.errors.cemail) return render();
    u.email = email; render(); toast('Correo actualizado');
  },
  cfgPass(fd){
    const u = usr(S.uid), e = {};
    if (fd.get('p0') !== (u.pass || CRED)) e.p0 = 'La contraseña actual no es correcta.';
    if (fd.get('p1').length < 8) e.p1 = 'Mínimo 8 caracteres.';
    if (fd.get('p1') !== fd.get('p2')) e.p2 = 'No coincide.';
    S.errors = e; if (Object.keys(e).length) return render();
    u.pass = fd.get('p1'); render(); toast('Contraseña cambiada');
  },
  perfilEmpresa(fd){
    const e = {}, lat = parseFloat(fd.get('lat')), lng = parseFloat(fd.get('lng'));
    ['nombre','localidad','direccion'].forEach(k => { if (!fd.get(k).trim()) e[k] = 'Campo obligatorio.'; });
    if (fd.get('web') && !isUrl(fd.get('web'))) e.web = 'Introduce una URL válida (https://…).';
    if (fd.get('telefono') && !/^[+\d\s]{9,15}$/.test(fd.get('telefono'))) e.telefono = 'Teléfono no válido.';
    if (isNaN(lat) || lat < -90 || lat > 90) e.lat = 'Debe estar entre -90 y 90.';
    if (isNaN(lng) || lng < -180 || lng > 180) e.lng = 'Debe estar entre -180 y 180.';
    S.errors = e; if (Object.keys(e).length) return render();
    const em = meEmpresa(); ['nombre','web','telefono','localidad','direccion','descripcion'].forEach(k => em[k] = fd.get(k).trim()); em.lat = lat; em.lng = lng; S.pickCoords = null;
    render(); toast('Perfil de empresa actualizado');
  },
  oferta(fd){
    keepForm(); const v = S.formVals, e = {};
    if (!v.titulo.trim()) e.titulo = 'El título es obligatorio.';
    if (v.descripcion.trim().length < 20) e.descripcion = 'Describe la oferta (mínimo 20 caracteres).';
    if (!v.localidad.trim()) e.localidad = 'La localidad es obligatoria.';
    if (!(+v.plazas > 0) || !Number.isInteger(+v.plazas)) e.plazas = 'Debe ser un número entero mayor que 0.';
    if (v.remunerada && (v.salario === '' || +v.salario < 0)) e.salario = 'Indica un salario igual o mayor que 0.';
    if (!v.limite) e.limite = 'Indica la fecha límite.'; else if (v.limite < HOY) e.limite = 'La fecha no puede ser anterior a hoy.';
    if (!S.draftTecs.length) e.tecs = 'Añade al menos una tecnología.';
    S.errors = e; if (Object.keys(e).length) { render(); toast('Revisa los campos marcados', 'bad'); return; }
    const data = {titulo:v.titulo.trim(), descripcion:v.descripcion.trim(), ciclo:v.ciclo, localidad:v.localidad.trim(), modalidad:v.modalidad, remunerada:v.remunerada, salario:v.remunerada ? +v.salario : null, plazas:+v.plazas, limite:v.limite, activa:v.activa, tecs:S.draftTecs.map(t => ({...t}))};
    if (S.sec === 'editar') { Object.assign(ofe(S.editOferta), data); toast('Oferta actualizada'); }
    else { const id = nextId(D.ofertas); D.ofertas.push({id, empresaId:meEmpresa().id, publicada:HOY, ...data}); toast('Oferta publicada. Ahora puedes definir su proceso de selección.'); }
    S.draftTecs = null; S.formVals = null; go('panel', null, 'ofertas');
  },
  fases(){
    const e = {}; S.draftFases.forEach((f,i) => { if (!f.nombre.trim()) e['fn' + i] = 'Pon un nombre a la fase.'; if (f.dias === '' || +f.dias < 0) e['fdias' + i] = 'Mínimo 0.'; });
    S.errors = e; if (Object.keys(e).length) return render();
    D.fases = D.fases.filter(f => f.ofertaId != S.procOferta);
    let id = nextId(D.fases);
    S.draftFases.forEach((f,i) => D.fases.push({...f, id:id++, ofertaId:S.procOferta, orden:i + 1, dias:+f.dias}));
    S.draftFases = null; render(); toast('Proceso de selección guardado');
  }
};

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  if (ev.target.classList?.contains('modal-bg')) { closeModal(); return; }
  const a = ev.target.closest('[data-act]');
  if (a && !['SELECT','INPUT'].includes(a.tagName)) { ev.preventDefault?.(); if (a.tagName === 'A') return; A[a.dataset.act]?.(a.dataset.id, a, ev); return; }
  if (a && a.type === 'radio') { A[a.dataset.act]?.(a.dataset.id, a, ev); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { if (g.dataset.tipo) S.regTipo = g.dataset.tipo; else if (g.dataset.go === 'registro') S.regTipo = S.regTipo || 'ALUMNO'; go(g.dataset.go, g.dataset.id ? +g.dataset.id : null, g.dataset.sec || null); return; }
  const svg = ev.target.closest('svg[data-pick]');
  if (svg) {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * MAP.w, y = (ev.clientY - r.top) / r.height * MAP.h;
    const [lat, lng] = unproj(x, y); S.pickCoords = {lat:+lat.toFixed(4), lng:+lng.toFixed(4)};
    const keep = Object.fromEntries(new FormData(document.querySelector('form[data-form="perfilEmpresa"]')));
    render(); Object.entries(keep).forEach(([k,v]) => { if (k !== 'lat' && k !== 'lng') { const el = document.querySelector(`[name="${k}"]`); if (el) el.value = v; } });
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
  if (ev.key === 'Enter' && ev.target.matches?.('.ocard, .mk')) ev.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act && ['SELECT','INPUT'].includes(t.tagName) && t.type !== 'radio') { A[t.dataset.act]?.(t.dataset.id, t, ev); return; }
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; renderResultados(); }
  if (t.dataset.mapf === 'loc') { S.mapLoc = t.value; S.mapSel = null; render(); }
  if (t.dataset.adminf === 'rol') { S.adminUserRol = t.value; render(); }
  if (t.dataset.fase !== undefined && t.type === 'checkbox') S.draftFases[+t.dataset.fase].obligatoria = t.checked;
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.filter === 'q') { S.f.q = t.value; renderResultados(); }
  if (t.dataset.mapf === 'q') { S.mapQ = t.value; const pos = t.selectionStart; render(); const n = $('#m-q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.adminf === 'q') { S.adminUserQ = t.value; const pos = t.selectionStart; render(); const n = $('#au-q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.fase !== undefined && t.type !== 'checkbox') { S.draftFases[+t.dataset.fase][t.dataset.k] = t.value; if (t.dataset.k === 'dias') { const tot = S.draftFases.reduce((s,f) => s + (+f.dias || 0), 0); const b = t.closest('form').querySelector('.row.between b'); if (b) b.textContent = tot + ' días'; } }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault(); F[f.dataset.form]?.(new FormData(f), f);
});
$('#menuBtn').addEventListener('click', () => { S.menu = !S.menu; renderHeader(); });

render();
</script>
